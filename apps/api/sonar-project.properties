# SonarQube Server / SonarScanner for .NET configuration.
# All paths are relative to this file. The CI workflow uses
# `dotnet-sonarscanner` begin -> build -> test -> end with this file as base.

sonar.projectKey=project-template
sonar.projectName=project-template
sonar.projectVersion=1.0

# Solution under analysis.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/bin/**,**/obj/**,**/TestResults/**

# C# language defaults; rely on the scanner to detect Roslyn analyzers.
sonar.cs.analyzer.projectOutPaths=src/**/bin,tests/**/bin
sonar.sourceEncoding=UTF-8

# Coverage import path consumed by the workflow.
# The CI runs `dotnet test --collect:"XPlat Code Coverage"`, which writes
# one Cobertura XML per test project under TestResults/.../coverage.cobertura.xml.
# The workflow copies the first report to coverage/coverage.cobertura.xml
# and the SonarScanner for .NET imports it via the C# Cobertura property.
sonar.cs.cobertura.reportsPaths=coverage/coverage.cobertura.xml

# Quality gate is enforced server-side.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
