services:
  # ── Database ───────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: project-template-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projecttemplate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-projecttemplate}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Migration Service ────────────────────────────────────
  # Applies EF Core migrations and seeds initial data (superadmin).
  # Runs once on container start and exits when complete.
  migration:
    build:
      context: .
      dockerfile: infra/docker/migration.Dockerfile
    container_name: project-template-migration
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: ${MIGRATION_CONNECTIONSTRING:-Host=db;Port=5432;Database=projecttemplate;Username=postgres;Password=dev_password_change_me}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@project-template.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-dev_password_change_me}
    restart: "no"

  # ── API ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: project-template-api
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=db;Port=5432;Database=projecttemplate;Username=postgres;Password=dev_password_change_me}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Frontend (Phase 1 placeholder — static HTML) ────────
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: project-template-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
